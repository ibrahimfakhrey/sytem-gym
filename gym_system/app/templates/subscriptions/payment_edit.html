{% extends "base.html" %}
{% block title %}تعديل دفعة{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-pencil-square"></i> تعديل دفعة #{{ payment.id }}</h1>
    <a href="{{ url_for('subscriptions.view', subscription_id=subscription.id) }}" class="btn btn-secondary">
        <i class="bi bi-x-lg"></i> رجوع
    </a>
</div>

<div class="row">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="alert alert-info small">
                        <i class="bi bi-info-circle"></i>
                        أي تعديل في المبلغ أو طريقة الدفع سينعكس تلقائياً على سجل الدخل
                        ومتبقي الاشتراك حتى لا تختلف أرقام الإقفال اليومي.
                    </div>

                    <div class="mb-3">
                        <label class="form-label">الاشتراك</label>
                        <input type="text" class="form-control bg-light" readonly
                               value="#{{ subscription.id }} — {{ subscription.member.name }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="amount" class="form-label">المبلغ *</label>
                            <input id="amount" name="amount" type="number" step="0.01" min="0.01"
                                   required class="form-control" value="{{ payment.amount }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="payment_method" class="form-label">طريقة الدفع</label>
                            <select id="payment_method" name="payment_method" class="form-select">
                                <option value="cash" {% if payment.payment_method == 'cash' %}selected{% endif %}>نقدي</option>
                                <option value="card" {% if payment.payment_method == 'card' %}selected{% endif %}>بطاقة</option>
                                <option value="transfer" {% if payment.payment_method == 'transfer' %}selected{% endif %}>تحويل</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">ملاحظات</label>
                        <textarea id="notes" name="notes" class="form-control" rows="3">{{ payment.notes or '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success" data-dedupe-submit>
                            <i class="bi bi-check-lg"></i> حفظ التعديلات
                        </button>
                        <a href="{{ url_for('subscriptions.view', subscription_id=subscription.id) }}"
                           class="btn btn-outline-secondary">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
