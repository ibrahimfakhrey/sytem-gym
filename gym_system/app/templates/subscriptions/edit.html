{% extends "base.html" %}
{% block title %}تعديل اشتراك{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-pencil-square"></i> تعديل اشتراك #{{ subscription.id }}</h1>
    <a href="{{ url_for('subscriptions.view', subscription_id=subscription.id) }}" class="btn btn-secondary">
        <i class="bi bi-x-lg"></i> رجوع
    </a>
</div>

<div class="row">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="alert alert-info small">
                        <i class="bi bi-info-circle"></i>
                        لتعديل الحقول المالية (السعر، طريقة الدفع، الباقة) — استخدم استرداد + اشتراك جديد بدلاً من التعديل المباشر.
                    </div>

                    <div class="mb-3">
                        <label class="form-label">العضو</label>
                        <input type="text" class="form-control bg-light" value="#{{ subscription.member.id }} {{ subscription.member.name }}" readonly>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">تاريخ البداية</label>
                            <input type="text" class="form-control bg-light" value="{{ subscription.start_date }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_date" class="form-label">تاريخ النهاية</label>
                            <input id="end_date" name="end_date" type="date" class="form-control" value="{{ subscription.end_date }}">
                            <div class="form-text">يمكن مدّ أو تقصير الاشتراك من هنا.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">ملاحظات</label>
                        <textarea id="notes" name="notes" class="form-control" rows="3">{{ subscription.notes or '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success" data-dedupe-submit>
                            <i class="bi bi-check-lg"></i> حفظ التعديلات
                        </button>
                        <a href="{{ url_for('subscriptions.view', subscription_id=subscription.id) }}" class="btn btn-outline-secondary">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
